# Philosophy: small files, small functions, no escape hatches. Limits are errors, not suggestions.
# Never raise a limit to make code pass; split the code instead.
strict: true
included: [Sources, Tests]

# ---- Anti-god-file / anti-god-function limits -------------------------------------------------
file_length: { warning: 300, error: 500, ignore_comment_only_lines: true }
type_body_length: { warning: 100, error: 180 }
function_body_length: { warning: 25, error: 40 }
closure_body_length: { warning: 15, error: 25 }
cyclomatic_complexity: { warning: 8, error: 12, ignores_case_statements: true }
function_parameter_count: { warning: 4, error: 6 }
line_length: { warning: 110, error: 130, ignores_comments: true, ignores_urls: true }
nesting: { type_level: 1, function_level: 2 }
large_tuple: { warning: 2, error: 3 }

opt_in_rules:
  - force_unwrapping
  - closure_body_length
  - one_declaration_per_file   # one primary type per file: the strongest god-file guard
  - contains_over_filter_count
  - contains_over_first_not_nil
  - direct_return
  - discouraged_optional_boolean
  - discouraged_optional_collection
  - empty_count
  - explicit_init
  - fatal_error_message
  - first_where
  - implicitly_unwrapped_optional
  - last_where
  - multiline_parameters
  - prefer_self_in_static_references
  - private_over_fileprivate
  - reduce_into
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_whitespace_closing_braces

disabled_rules:
  - optional_data_string_conversion   # false positive on String(decoding:) of [UInt8]
  - todo   # replaced by custom rule below (TODOs are errors)

# Safety
force_unwrapping: error
force_cast: error
force_try: error
trailing_comma: { mandatory_comma: true }
identifier_name: { min_length: 2, excluded: [id, x, y, dx, dy] }

# ---- Architecture and performance guards -----------------------------------------------------
custom_rules:
  core_stays_pure:
    name: "BloxCore must stay platform-free"
    regex: '^\s*(@_exported\s+)?import\s+(AppKit|Cocoa|SwiftUI|ApplicationServices|QuartzCore|ScreenCaptureKit|Carbon)\b'
    included: 'Sources/BloxCore/.*\.swift'
    message: "Core is pure logic. OS access belongs in BloxPlatform behind a port protocol."
    severity: error
  no_singletons:
    name: "No singletons"
    regex: 'static\s+(let|var)\s+shared\b'
    message: "Inject dependencies from the composition root (BloxApp) instead."
    severity: error
  no_polling:
    name: "No polling"
    regex: '(Timer\.scheduledTimer|Timer\(timeInterval|Thread\.sleep|usleep\(|DispatchSourceTimer)'
    message: "Be event-driven. Idle CPU must be ~0%; use AXObserver/notifications, not timers."
    severity: error
  no_unsafe_concurrency:
    name: "No unchecked concurrency"
    regex: '(@unchecked\s+Sendable|nonisolated\(unsafe\)|DispatchQueue\.main\.sync|Task\.detached)'
    message: "Use actors/@MainActor. Do not bypass the concurrency checker."
    severity: error
  no_print:
    name: "No print"
    regex: '\bprint\('
    excluded: 'Sources/BloxCLI/.*'
    message: "Use the logger. print is only for the CLI's user-facing output."
    severity: error
  no_todo:
    name: "No TODO/FIXME"
    regex: '(//|/\*)\s*(TODO|FIXME|HACK|XXX)\b'
    message: "Finish it or record it in an issue/ADR. No TODO comments."
    severity: error
  final_by_default:
    name: "Classes must be final"
    regex: '^\s*((public|internal|private|open)\s+)?class\s+[A-Z]\w*'
    message: "Prefer structs/actors/enums. If a class is needed, mark it final."
    severity: error
