# Fullscreen + hide dock / exit fullscreen + restore dock
"alt-shift-f" = "fullscreen ; exec osascript -e 'tell application \"System Events\" to set autohide of dock preferences to true'"
"alt-shift-g" = "fullscreen ; exec osascript -e 'tell application \"System Events\" to set autohide of dock preferences to false'"

"alt-tab" = "workspace-back-and-forth"
"alt-shift-tab" = "move-workspace-to-monitor"

"alt-shift-semicolon" = "mode service"
"alt-shift-r" = "mode resize"
"alt-shift-period" = "mode anim"

# Resize mode. Blox resizes the main split by ratio: h/k shrink it, l/j grow it.
[mode.resize]
h = "resize -0.03"
j = "resize 0.03"
k = "resize -0.03"
l = "resize 0.03"
b = "balance"
minus = "resize -0.03"
equal = "resize 0.03"
enter = "mode main"
esc = "mode main"

[mode.service]
esc = "reload-config ; mode main"
r = "retile ; mode main"
f = "toggle-floating ; mode main"

# Animation playground: each key switches the style live, so you can feel the difference.
[mode.anim]
"1" = "animation hyprdots"
"2" = "animation classic"
"3" = "animation diablo"
"4" = "animation diablo-overshoot"
"5" = "animation minimal"
"6" = "animation moving"
"7" = "animation optimized"
"8" = "animation vertical"
h = "animation hyprland"
e = "animation end4"
w = "animation wind"
s = "animation smooth"
c = "animation circ"
q = "animation quart"
o = "animation overshoot"
b = "animation bounce"
f = "animation fast"
n = "animation snappy"
x = "animation off"
esc = "mode main"
enter = "mode main"
