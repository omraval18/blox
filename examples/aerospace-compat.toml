# Blox config, ported from an AeroSpace setup: same keys, same workspaces, same modes.
# Hyprland-inspired extras: animation styles, a focus ring, and named bezier curves.
#
# Not ported (Blox keeps a flat window list, not nested containers): join-with,
# flatten-workspace-tree, close-all-windows-but-current, accordion padding.

# Same as the AeroSpace setup: nothing around the screen edge, 18 points between windows
# (side by side and stacked).
[gaps]
inner = 18
outer = 0
# outer-top = 32        # per-edge override of outer, e.g. room for a custom bar
# smart = true          # no gaps around a lone window (Hyprland's no_gaps_when_only)

[layout]
default = "tiles"   # AeroSpace default: one row of full-height columns
ratio = 0.5

# Like AeroSpace's on-focus-changed = move-mouse window-lazy-center.
[focus]
mouse-follows = true

# Window borders, from hyprdots (Catppuccin): focused windows get a mauve-to-rosewater gradient,
# the rest a soft grey-blue. Last two hex digits are opacity. radius matches macOS windows
# (hyprdots uses 10 for its own rounding). The ring is drawn inside each window's edge.
# Set enabled = false to turn borders off, or remove the inactive line to ring only the
# focused window.
[border]
enabled = true
width = 2
radius = 20
colors = "ca9ee6 f2d5cf"
inactive = "b4befecc 6c7086cc"
angle = 45

# Animation, copied from prasanthrangan/hyprdots: the "wind" curve at its window-move speed
# (0.5 s). Press alt-shift-period for the "anim" mode to try every preset live:
#   1 hyprdots  2 classic  3 diablo  4 diablo-overshoot  5 minimal  6 moving  7 optimized
#   8 vertical  h hyprland  e end4  w wind  s smooth  c circ  q quart  o overshoot  b bounce
#   f fast  n snappy  x off   (esc to leave)
[animation]
style = "hyprdots"

# Hyprland's windowsIn: how a new window arrives. slide (glide from where the app opened it)
# | popin [percent] (grow from the centre of its tile) | off. duration and curve are optional
# and default to the values above.
[animation.open]
style = "slide"

# Hyprland's workspaces: windows glide off one edge and the new workspace's windows in from the
# other. slide | off. Shorter than window moves, so switching stays quick.
[animation.workspaces]
style = "slide"
duration = 0.3

# Your own beziers, Hyprland-style: name = "x1 y1 x2 y2". Use one with  curve = "<name>"
# under [animation]. These come straight from configs by end-4, JaKooLit and linuxmobile.
[curves]
md3_decel = "0.05 0.7 0.1 1"
menu_decel = "0.1 1 0 1"
win_in = "0.1 1.1 0.1 1.1"
crazyshot = "0.1 1 0.76 0.92"
slow = "0 0.85 0.3 1"

# App rules by bundle id (AeroSpace's on-window-detected).
[rules]
"com.google.Chrome" = "workspace B"
"com.mitchellh.ghostty" = "workspace T"

[bindings]
"alt-slash" = "layout tiles"
"alt-shift-slash" = "layout dwindle"
"alt-comma" = "layout monocle"
"alt-shift-comma" = "layout primary"
"alt-h" = "focus left"
"alt-j" = "focus down"
"alt-k" = "focus up"
"alt-l" = "focus right"
"alt-shift-h" = "move left"
"alt-shift-j" = "move down"
"alt-shift-k" = "move up"
"alt-shift-l" = "move right"

"alt-1" = "workspace 1"
"alt-2" = "workspace 2"
"alt-3" = "workspace 3"
"alt-4" = "workspace 4"
"alt-5" = "workspace 5"
