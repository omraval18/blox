# Blox config, ported from an AeroSpace setup: same keys, same workspaces, same modes.
# Hyprland-inspired extras: animation styles, a focus ring, and named bezier curves.
#
# Not ported (Blox keeps a flat window list, not nested containers): join-with,
# flatten-workspace-tree, close-all-windows-but-current, accordion padding.

[gaps]
inner = 18
outer = 0

[layout]
default = "dwindle"
ratio = 0.5

# Like AeroSpace's on-focus-changed = move-mouse window-lazy-center.
[focus]
mouse-follows = true

# Focus ring (the signature Hyprland look). Colors: cyan to green at 45 degrees.
# Try: colors = "e5b9c6 c293a3" (soft pink), "ff6ac1 8be9fd" (neon), "ffffff" (plain white).
[border]
enabled = true
width = 3
radius = 12
colors = "33ccff 00ff99"
angle = 45

# Animation. Styles come from popular Hyprland configs. Press alt-shift-period to enter the
# "anim" mode and try them live: 1 snappy, 2 fast, 3 hyprland, 4 end4, 5 ml4w, 6 wind,
# 7 smooth, 8 circ, 9 quart, o overshoot, b bounce, x off, esc back.
[animation]
style = "hyprland"

# Your own beziers, Hyprland-style: name = "x1 y1 x2 y2". Use one with  curve = "<name>"
# under [animation]. These come straight from configs by end-4, JaKooLit and linuxmobile.
[curves]
md3_decel = "0.05 0.7 0.1 1"
menu_decel = "0.1 1 0 1"
win_in = "0.1 1.1 0.1 1.1"
crazyshot = "0.1 1 0.76 0.92"
slow = "0 0.85 0.3 1"

# App rules by bundle id (AeroSpace's on-window-detected).
[rules]
"com.google.Chrome" = "workspace B"
"com.mitchellh.ghostty" = "workspace T"

[bindings]
"alt-slash" = "layout dwindle"
"alt-comma" = "layout monocle"
"alt-shift-comma" = "layout primary"
"alt-h" = "focus left"
"alt-j" = "focus down"
"alt-k" = "focus up"
"alt-l" = "focus right"
"alt-shift-h" = "move left"
"alt-shift-j" = "move down"
"alt-shift-k" = "move up"
"alt-shift-l" = "move right"

"alt-1" = "workspace 1"
"alt-2" = "workspace 2"
"alt-3" = "workspace 3"
"alt-4" = "workspace 4"
"alt-5" = "workspace 5"
"alt-6" = "workspace 6"
